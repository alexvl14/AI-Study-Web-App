version: "3.8"

services:
  backend-dotnet:
    build: 
      context: ./backend-dotnet
      dockerfile: Dockerfile 
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      #DB
      - ConnectionStrings__DefaultConnection=Host=db;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      #python service
      - ExternalServices__Python__ServiceUrl=http://backend-python:8000
      - ExternalServices__Python__ApiKey=${PYTHON_API_KEY}
      #LLM
      - ExternalServices__Gemini__ApiKey=${GEMINI_API_KEY}

    volumes:
      - ./uploads:/app/uploads

  backend-python:
    build:
      context: ./backend-python
      dockerfile: Dockerfile
    ports:
      - "5001:8000"
    environment:
      - API_KEY=${PYTHON_API_KEY}
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend-dotnet  
         
  db:
    image: pgvector/pgvector:pg15
    container_name: postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data: