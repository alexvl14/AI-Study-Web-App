<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyLM — Server Error</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fbf9f9;
        color: #1b1c1c;
        font-family: 'Manrope', system-ui, -apple-system, sans-serif;
      }
      .card {
        background: #ffffff;
        border: 1px solid #1b1c1c;
        box-shadow: 4px 4px 0px 0px rgba(27, 28, 28, 0.2);
        padding: 2.5rem 3rem;
        max-width: 28rem;
        text-align: center;
      }
      h1 {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 1.75rem;
        margin: 0 0 0.5rem;
      }
      p {
        color: #3d4946;
        line-height: 1.5;
        margin: 0 0 1.5rem;
      }
      a {
        display: inline-block;
        background: #5ec9b8;
        color: #005249;
        text-decoration: none;
        padding: 0.75rem 2rem;
        border: 1px solid #1b1c1c;
        box-shadow: 4px 4px 0px 0px rgba(27, 28, 28, 0.2);
        font-weight: 700;
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Something went wrong</h1>
      <p>The server hit an unexpected error. Please try again in a moment.</p>
      <a href="/">Back to StudyLM</a>
    </div>
  </body>
</html>
