server {
    listen 80;
    server_name localhost;

    # Hide nginx version token
    server_tokens off;

    # --- Security headers (sent on every response) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Enable only once served over TLS:
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # CSP is Report-Only first so it can't break the app while it's validated.
    # 'unsafe-inline' in style-src is required by Tailwind inline styles (chat
    # bubble tails) and KaTeX; the Google Fonts host allowances are required by
    # the <link> tags in index.html. Promote to Content-Security-Policy once
    # verified with no violations.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    # --- Compression ---
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are immutable — cache hard.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached so new deploys are picked up.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://backend-dotnet:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # For .NET Identity endpoints like /manage/info, /login, etc.
    location /manage/ {
        proxy_pass http://backend-dotnet:8080/manage/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /login {
        proxy_pass http://backend-dotnet:8080/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /register {
        proxy_pass http://backend-dotnet:8080/register;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /logout {
        proxy_pass http://backend-dotnet:8080/logout;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
